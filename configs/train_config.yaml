# Cấu hình huấn luyện, hiệu chuẩn và kiểm thử nền tảng PhishGuard ML
model_version: "4.0.0"
random_seed: 42
feature_contract: lexical-v4

split:
  strategy: stratified-registered-domain-5way
  train: 0.60
  validation: 0.15
  calibration: 0.10
  threshold_validation: 0.05
  test: 0.10

model:
  type: XGBClassifier
  max_depth: 6
  learning_rate: 0.08
  n_estimators: 300
  eval_metric: logloss
  random_state: 42

calibration:
  method: isotonic # isotonic | sigmoid

threshold_policy:
  policy_version: browser-risk-v1
  caution_max_fpr: 0.02
  block_max_fpr: 0.005
  caution_min_recall: 0.90
  block_min_recall: 0.80

security_stress:
  min_block_recall: 0.80
  max_benign_block_rate: 0.20
