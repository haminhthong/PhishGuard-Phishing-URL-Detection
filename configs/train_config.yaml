# Cấu hình huấn luyện, hiệu chuẩn và kiểm thử nền tảng PhishGuard ML
model_version: "4.0.0"
random_seed: 42
feature_contract: lexical-v3

split:
  strategy: stratified-registered-domain-5way
  train: 0.60
  validation: 0.15
  calibration: 0.10
  policy_validation: 0.05
  test: 0.10

model_selection:
  primary_objective: pr_auc
  guardrails:
    min_recall: 0.80
    max_fpr: 0.01
    max_latency_p95_ms: 5.0

model:
  type: XGBClassifier
  max_depth: 6
  learning_rate: 0.08
  n_estimators: 300
  eval_metric: logloss
  random_state: 42

calibration:
  method: isotonic # isotonic | sigmoid

threshold_policy:
  policy_version: browser-risk-v1
  caution_max_fpr: 0.02
  block_max_fpr: 0.005
  asymmetric_cost:
    cost_fn: 10.0
    cost_fp: 1.0
promotion_policy:
  validation:
    min_pr_auc: 0.85
    min_recall: 0.80
    max_fpr: 0.01
  calibration:
    max_ece: 0.05
    operating_max_fpr: 0.005
  serving:
    max_model_p95_ms: 5.0
