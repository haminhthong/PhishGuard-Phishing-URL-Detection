<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard ML</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 360px;
            background: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            user-select: none;
        }

        /* HEADER & TOGGLE SHIELD */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .brand h1 {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.2;
        }

        .brand .subtitle {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* TOGGLE SWITCH */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px; width: 18px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* NAV TABS */
        nav {
            display: flex;
            gap: 4px;
            background: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        /* TAB CONTENT PANELS */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* STATUS CARD */
        .status-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--warning);
            box-shadow: 0 0 10px var(--warning);
        }

        .status-box.online .status-dot { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .status-box.offline .status-dot { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

        .status-title { font-size: 13px; font-weight: 700; }
        .status-desc { font-size: 11px; color: var(--text-muted); }

        /* URL CARD */
        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .info-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .info-value {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #e2e8f0;
        }

        /* BUTTONS */
        .btn-primary {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-danger-sm {
            padding: 4px 8px;
            border: none;
            border-radius: 6px;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            font-size: 11px;
            cursor: pointer;
        }
        .btn-danger-sm:hover { background: rgba(239, 68, 68, 0.4); }

        /* WHITELIST TAB */
        .whitelist-form {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .whitelist-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: #fff;
            font-size: 12px;
        }
        .whitelist-input:focus { outline: 1px solid var(--primary); }

        .whitelist-list {
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .whitelist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: var(--card-bg);
            border-radius: 8px;
            font-size: 12px;
        }

        /* HISTORY TAB */
        .history-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .history-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 8px 10px;
            background: var(--card-bg);
            border-radius: 8px;
        }
        .history-url {
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #cbd5e1;
        }
        .history-meta {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
        }
        .history-time { color: #64748b; }
        .empty-state {
            padding: 12px;
            text-align: center;
        }
        .badge-safe { color: var(--success); font-weight: 700; }
        .badge-phish { color: var(--danger); font-weight: 700; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <img src="icon.png" alt="PhishGuard ML Logo">
            <div>
                <h1>PhishGuard ML</h1>
                <div class="subtitle">Bảo vệ AI theo thời gian thực</div>
            </div>
        </div>
        <label class="switch" title="Bật/Tắt Khiên Bảo Vệ">
            <input type="checkbox" id="shieldToggle" checked>
            <span class="slider"></span>
        </label>
    </header>

    <nav>
        <button class="tab-btn active" data-tab="statusTab">Trạng thái</button>
        <button class="tab-btn" data-tab="whitelistTab">Whitelist</button>
        <button class="tab-btn" data-tab="historyTab">Lịch sử</button>
    </nav>

    <!-- TAB 1: TRẠNG THÁI -->
    <div id="statusTab" class="tab-content active">
        <div id="apiStatusBox" class="status-box">
            <div class="status-dot"></div>
            <div>
                <div id="apiStatusTitle" class="status-title">Đang kiểm tra kết nối API…</div>
                <div id="apiStatusDesc" class="status-desc">Local Endpoint: http://127.0.0.1:5000</div>
            </div>
        </div>

        <div class="info-card">
            <div class="info-label">Trang web hiện tại</div>
            <div id="currentTabUrl" class="info-value">Đang tải thông tin tab…</div>
        </div>

        <button id="retryApiBtn" class="btn-primary" type="button">Kiểm tra kết nối lại</button>
    </div>

    <!-- TAB 2: WHITELIST -->
    <div id="whitelistTab" class="tab-content">
        <div class="whitelist-form">
            <input type="text" id="domainInput" class="whitelist-input" placeholder="ví dụ: company.com">
            <button id="addDomainBtn" class="btn-primary" style="width: 70px;">Thêm</button>
        </div>
        <div id="whitelistContainer" class="whitelist-list">
            <!-- Render từ popup.js -->
        </div>
    </div>

    <!-- TAB 3: LỊCH SỬ QUÉT -->
    <div id="historyTab" class="tab-content">
        <div id="historyContainer" class="history-list">
            <!-- Render từ popup.js -->
        </div>
        <button id="clearHistoryBtn" class="btn-danger-sm" style="width: 100%; margin-top: 10px;">Xóa lịch sử</button>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
</body>
</html>
